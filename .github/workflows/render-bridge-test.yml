name: Render Bridge Integration Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'integration/openai-blynk-bridge/**'
      - '.github/workflows/render-bridge-test.yml'
  pull_request:
    paths:
      - 'integration/openai-blynk-bridge/**'
      - '.github/workflows/render-bridge-test.yml'

jobs:
  test-render-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/openai-blynk-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check syntax
        run: node --check server.js
      - name: Test current bridge HTTP contracts without live credentials
        run: npm test
